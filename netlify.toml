[build]
  command = "echo 'Build complete'"
  publish = "."

[[redirects]]
  from = "/api/telegram/*"
  to = "https://api.telegram.org/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/discord/*"
  to = "https://discord.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
